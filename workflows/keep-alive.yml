name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours — comfortably under the 12-hour sleep threshold
  workflow_dispatch:          # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to reset the inactivity timer
        run: curl -sSf --max-time 30 https://YOUR-APP-URL.streamlit.app/ > /dev/null
